<title>먹킷 실행 애니메이션</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 폰 크기 칸 하나 + 다시 보기 · 느리게 보기 */
:root { --bg: #f4f3f0; --fg: #17181c; --muted: #6b6f78; --line: #dedcd6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141416; --fg: #ecebe8; --muted: #a3a3a8; --line: #2c2c30; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #141416; --fg: #ecebe8; --muted: #a3a3a8; --line: #2c2c30; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 "Noto Sans KR", system-ui, sans-serif; word-break: keep-all; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
h1 { font-size: 22px; margin: 0; align-self: stretch; }
p { margin: 0; color: var(--muted); align-self: stretch; }
#stage { position: relative; width: 300px; max-width: 100%; aspect-ratio: 390 / 844; border-radius: 28px; overflow: hidden; background: #f7f3ee; border: 1px solid var(--line); }
#stage .behind { position: absolute; inset: 0; display: grid; place-items: center; color: #8a8e96; font-size: 13px; }
.btns { display: flex; gap: 8px; }
button { font: inherit; border: 1px solid var(--line); background: #fff; color: #17181c; border-radius: 99px; padding: 8px 16px; cursor: pointer; }
button:focus-visible { outline: 2px solid #c8410b; outline-offset: 2px; }
.launch-ko, .launch-en { font-family: "Noto Sans KR", system-ui, sans-serif; }
/* 실행 애니메이션 — html[data-splash] 일 때만 (layout 의 스크립트가 그리기 전에 붙인다)
   0 ~ 0.42초 가운데에 수저가 놓임 → 0.42 ~ 0.72초 심볼이 비켜서며 글자가 펼쳐짐 → 0.95초까지 사라짐 */
.launch-splash {
  display: none;
}
#stage.play .launch-splash {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  animation: launch-out 220ms ease-in 760ms forwards;
}
.launch-lockup {
  display: flex;
  align-items: center;
  /* 글자 묶음 너비(약 74px) + 간격의 절반만큼 심볼을 처음엔 가운데로 */
  --launch-shift: 45px;
}
.launch-symbol {
  flex: none;
  fill: #c8410b;
  overflow: visible;
  animation: launch-slide 300ms cubic-bezier(0.3, 0, 0.2, 1) 420ms both;
}
.launch-spoon {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: launch-spoon 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.launch-chopstick {
  transform-box: fill-box;
  transform-origin: 50% 0%;
  animation: launch-chop 300ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.launch-word {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  animation: launch-word 300ms cubic-bezier(0.3, 0, 0.2, 1) 440ms both;
}
.launch-ko {
  display: block;
  line-height: 0.8;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #17181c;
}
.launch-en {
  display: block;
  line-height: 0.75;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-right: -0.1em;
  color: #5b5f69;
}
@keyframes launch-spoon {
  0% { opacity: 0; transform: translateY(-34%) scale(0.96); }
  60% { opacity: 1; transform: translateY(3%) scale(1); }
  100% { opacity: 1; transform: none; }
}
@keyframes launch-chop {
  from { opacity: 0; transform: translateY(26%); }
  to { opacity: 1; transform: none; }
}
@keyframes launch-slide {
  from { transform: translateX(var(--launch-shift)); }
  to { transform: none; }
}
@keyframes launch-word {
  from { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(-10px); }
  to { opacity: 1; clip-path: inset(0 0 0 0); transform: none; }
}
@keyframes launch-out {
  to { opacity: 0; visibility: hidden; }
}

</style>
<div class="wrap">
<h1>먹킷 실행 애니메이션</h1>
<p>지금 쓰는 수저 심볼과 글자 로고 그대로예요. 가운데에 수저가 놓이고, 심볼이 비켜서며 '먹킷 / MUKKIT' 이 펼쳐져 화면 위 글자 로고가 돼요. 전체 약 1초. 앱에서는 Pretendard 글꼴로 보여요.</p>
<div id="stage" class="play"><div class="behind">시작 화면</div><div class="launch-splash"><div class="launch-lockup" style="gap:16px"><svg class="launch-symbol" height="56" width="39" viewBox="220 120 548 780"><g class="launch-spoon"><path d="M336 470C356 496 372 522 374 554L358 850a42 42 0 0 0 84 0L426 554C428 522 444 496 464 470Z"/><ellipse cx="400" cy="312" rx="172" ry="184"/></g><path class="launch-chopstick" style="animation-delay:140ms" d="M596 170a30 30 0 0 1 60 0L647 870a21 21 0 0 1 -42 0Z"/><path class="launch-chopstick" style="animation-delay:210ms" d="M700 170a30 30 0 0 1 60 0L751 870a21 21 0 0 1 -42 0Z"/></svg><span class="launch-word" style="height:56px"><span class="launch-ko" style="font-size:37px;margin-top:1.75px">먹킷</span><span class="launch-en" style="font-size:15px">MUKKIT</span></span></div></div></div>
<div class="btns"><button type="button" id="again">다시 보기</button><button type="button" id="slow">4배 느리게</button></div>
</div>
<script>
const stage = document.getElementById("stage");
const replay = (slow) => {
  stage.classList.remove("play");
  void stage.offsetWidth;
  stage.getAnimations({ subtree: true }).forEach((a) => a.cancel());
  stage.classList.add("play");
  stage.getAnimations({ subtree: true }).forEach((a) => { a.playbackRate = slow ? 0.25 : 1; });
};
document.getElementById("again").addEventListener("click", () => replay(false));
document.getElementById("slow").addEventListener("click", () => replay(true));
</script>
